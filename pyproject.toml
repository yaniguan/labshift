[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labshift"
version = "0.1.0"
description = "A synthetic lab scheduling and planning benchmark"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yani Guan" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cpsat = [
    "ortools>=9.8",
]
pyjobshop = [
    "pyjobshop>=0.0.9",
]
dev = [
    "ortools>=9.8",
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
labshift = "labshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labshift"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ortools.*", "pyjobshop.*"]
ignore_missing_imports = true
