[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labshift"
version = "0.1.0"
description = "A synthetic lab scheduling and planning benchmark"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yani Guan" }]
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
labshift = "labshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
